environment:
  grid_size: 10
  num_agents: 4
  episode_length: 200
  env_id: rware-tiny-4ag-v2

heterogeneity:
  enabled: true
  mode: uniform
  energy_weight: 0.0

  # Narrow ranges = agents are very similar to each other
  # NOTE: speed must be between 0.0 and 1.0
  uniform_ranges:
    speed: [0.85, 1.0]
    load_capacity: [3, 4]
    battery: [85, 100]

  explicit_fleet: []

# Training
seed: 42
total_env_steps: 500000

# QMIX hyperparameters
gamma: 0.99
hidden_dim: 64
mixing_hidden_dim: 32
learning_rate: 0.0001
buffer_size: 50000
batch_size: 64
target_update_interval: 400

# Exploration (linear epsilon decay)
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 100000

# MAPPO-specific hyperparameters
gae_lambda: 0.95
clip_eps: 0.2
entropy_coef: 0.01
value_loss_coef: 0.5
ppo_epochs: 4
rollout_len: 400

# Logging / checkpointing
log_dir: runs
checkpoint_interval: 25000
log_interval: 1000