environment:
  grid_size: 10
  num_agents: 3
  episode_length: 200

heterogeneity:
  enabled: true
  mode: explicit   # options: "uniform" or "explicit"

  # Ignored when mode is "uniform"
  uniform_ranges:
    speed: [0.5, 1.5]
    load_capacity: [1, 5]
    battery: [50, 100]

  # Used when mode is "explicit" — one entry per agent, exact values
  explicit_fleet:
    - agent_id: 0
      speed: 1.2
      load_capacity: 3
      battery: 90
    - agent_id: 1
      speed: 0.8
      load_capacity: 5
      battery: 60
    - agent_id: 2
      speed: 1.0
      load_capacity: 2
      battery: 100