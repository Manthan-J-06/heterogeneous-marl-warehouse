# MAPPO — homogeneous fleet baseline on RWARE
env_id: rware-tiny-4ag-easy-v2
seed: 0
total_env_steps: 500000

# Algorithm hyperparameters
gamma: 0.99
gae_lambda: 0.95
clip_eps: 0.2
entropy_coef: 0.01
value_loss_coef: 0.5
ppo_epochs: 4
hidden_dim: 64
learning_rate: 0.0003
rollout_len: 400          # env steps collected per PPO update

# Logging / checkpointing
log_dir: runs/mappo_rware_homogeneous
checkpoint_interval: 25000
log_interval: 1
