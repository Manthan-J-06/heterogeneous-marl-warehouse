# QMIX — homogeneous fleet baseline on RWARE
env_id: rware-tiny-4ag-easy-v2
seed: 0
total_env_steps: 500000

# Algorithm hyperparameters
gamma: 0.99
hidden_dim: 64
mixing_hidden_dim: 32
learning_rate: 0.0005
buffer_size: 50000
batch_size: 64
target_update_interval: 200

# Exploration (linear epsilon decay)
epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 100000

# Logging / checkpointing
log_dir: runs/qmix_rware_homogeneous
checkpoint_interval: 25000
log_interval: 1000
